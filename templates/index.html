<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple ChatBot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chatbox {
            width: 400px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 20px;
        }
        .messages {
            height: 300px;
            overflow-y: auto;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            padding: 10px;
        }
        .user, .bot {
            margin: 5px 0;
            padding: 8px;
            border-radius: 5px;
        }
        .user {
            background: #d1e7dd;
            text-align: right;
        }
        .bot {
            background: #f8d7da;
            text-align: left;
        }
        input {
            width: 80%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 18%;
            padding: 10px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="chatbox">
        <div class="messages" id="chat">
            <div class="bot"><b>Bot:</b> Hello! Type something to start chatting.</div>
        </div>
        <input type="text" id="userInput" placeholder="Type your message...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        async function sendMessage() {
            const userInput = document.getElementById("userInput").value;
            if (userInput.trim() === "") return;

            const chat = document.getElementById("chat");
            chat.innerHTML += `<div class='user'><b>You:</b> ${userInput}</div>`;

            const response = await fetch("/get", {
                method: "POST",
                headers: {"Content-Type": "application/x-www-form-urlencoded"},
                body: `msg=${encodeURIComponent(userInput)}`
            });

            const data = await response.json();
            chat.innerHTML += `<div class='bot'><b>Bot:</b> ${data.response}</div>`;

            document.getElementById("userInput").value = "";
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
